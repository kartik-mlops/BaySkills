<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaySkills</title>
<link rel="icon" href="/favicon.png">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="/baymax3d.js"></script>
<style>
@font-face{font-family:"Oughter";src:url(/fonts/Oughter.otf) format("opentype");font-display:swap}
:root{--bg:#0a0a0a;--card:#141415;--tx:#f2f2f2;--mu:#8f8f95;--bd:#2a2a2d;--ac:#f2f2f2;--ac2:#232326;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--hd:"Oughter","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{font-weight:700;font-size:1.05rem;padding:4px 10px 16px}.logo span{color:var(--ac)}
aside button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--mu);padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
aside button.on{background:var(--ac2);color:var(--ac);font-weight:600}.sp{flex:1}
main{padding:20px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1,h2,.hi{font-family:var(--hd);font-weight:400;font-synthesis:none;letter-spacing:.01em}h1{font-size:1.35rem;margin:0}h2{font-size:1rem;margin:0 0 10px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;min-width:0}
.kpi small{color:var(--mu)}.kpi b{display:block;font-size:1.6rem;line-height:1.2}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac)}
.h{display:flex;justify-content:space-between;gap:8px}.tag{font-size:.72rem;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
select,input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:.82rem;color:var(--mu);margin:10px 0 4px}
.btn{border:0;background:var(--ac);color:#0a0a0a;font-weight:500;padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer}.btn:disabled{opacity:.6}.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,aside button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}.opt:hover{border-color:var(--mu)}
.mu,small{color:var(--mu)}.sk{margin:10px 0}a{color:var(--ac)}.wrap{overflow-x:auto}ul{margin:.3em 0;padding-left:1.2em}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:.88rem}
.pipe{display:flex;gap:6px}.pipe div{flex:1;text-align:center;background:var(--bg);border-radius:8px;padding:8px 2px;font-size:.75rem;color:var(--mu)}.pipe b{display:block;font-size:1.2rem;color:var(--tx)}
#auth:not([hidden]){display:grid;grid-template-columns:minmax(380px,5fr) 6fr;min-height:100vh}
.apanel{display:flex;padding:32px 28px;background:radial-gradient(120% 80% at 0% 0%,#1b1b1d,#0a0a0a 70%)}.abox{margin:auto;width:100%;max-width:410px}
.alogo{width:132px;display:block;margin-bottom:22px}.abox .tabs{margin-top:16px}
.ahero{position:relative;overflow:hidden;background:#c1272d;min-height:100vh}
.ahero>img,.ahero>model-viewer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:78% 50%;transform:scale(1.05)}
.h3d{position:absolute;inset:0;cursor:pointer}.ahero.on3d>img{display:none}.ahero>img{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:scale(1.05) translateY(-12px)}}
.ahero>model-viewer{transform:none;--poster-color:transparent;background:transparent}
.hello{position:absolute;left:6%;top:9%;color:#fff;max-width:36%;pointer-events:none}.hi{font-size:clamp(3rem,5.6vw,5.4rem);line-height:1;margin:0 0 12px}.hello p{margin:0;font-size:1.05rem;line-height:1.45;opacity:.92}
@media(max-width:860px){#auth:not([hidden]){grid-template-columns:1fr}.ahero{order:-1;min-height:230px}.hello{top:14%;max-width:48%}.hi{font-size:2.6rem}.hello p{display:none}}
@media(prefers-reduced-motion:reduce){.h3d{position:absolute;inset:0;cursor:pointer}.ahero.on3d>img{display:none}.ahero>img{animation:none}}.tabs{display:flex;gap:8px;margin-bottom:8px}.tabs .btn{flex:1}
.err{color:var(--bad);min-height:1.3em;font-size:.88rem}.quote{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;white-space:pre-wrap}
#bm{position:fixed;right:14px;bottom:6px;width:150px;height:200px;z-index:5}#bmv{position:absolute;inset:0;cursor:pointer}#bmsay{position:absolute;right:6px;bottom:100%;width:max-content;max-width:230px;background:var(--ac);color:#0a0a0a;padding:9px 13px;border-radius:12px 12px 4px 12px;font-size:.85rem;line-height:1.35}#chat{position:fixed;right:14px;bottom:214px;width:380px;max-width:calc(100vw - 28px);height:min(540px,calc(100vh - 240px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:16px;z-index:6;box-shadow:0 16px 48px rgba(0,0,0,.65)}
.chh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}.chh b{font-family:var(--hd);font-weight:400}.chh button{background:none;border:0;color:var(--mu);font-size:1.3rem;cursor:pointer;line-height:1}
#cm{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:8px 12px;border-radius:12px;line-height:1.4;font-size:.9rem;overflow-wrap:anywhere}.m.b{background:var(--ac2);align-self:flex-start;border-bottom-left-radius:4px}.m.u{background:var(--ac);color:#0a0a0a;align-self:flex-end;border-bottom-right-radius:4px}.m.mu{color:var(--mu)}
#cq{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}#cq button{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:99px;padding:5px 11px;font:inherit;font-size:.8rem;cursor:pointer}#cq button:hover{border-color:var(--mu)}
.cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}.cf input{flex:1}
.rm{display:grid;gap:12px;margin-top:14px}.ph{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}.dot{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#0a0a0a;display:grid;place-items:center;font-family:var(--hd)}
.tk{display:flex;gap:10px;align-items:flex-start;color:var(--tx);font-size:.9rem;margin:8px 0}.tk input{width:auto;margin-top:3px}
@media(max-width:760px){#bm{width:96px;height:130px}#bmsay{max-width:62vw}#chat{bottom:144px;height:calc(100vh - 170px)}}
.bar.mk{position:relative;overflow:visible}.bar.mk i{border-radius:9px}.bar.mk u{position:absolute;top:-4px;width:3px;height:16px;background:var(--warn);border-radius:2px}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:1px 9px;font-size:.78rem;margin:2px 4px 2px 0;color:var(--tx);text-decoration:none;background:none;font-family:inherit;line-height:1.5}.chip.ok{color:var(--ok);border-color:currentColor}.chip.no{color:var(--warn);border-color:currentColor}button.chip{cursor:pointer}button.chip:hover,a.chip:hover{border-color:var(--mu)}
a.btn{text-decoration:none;display:inline-block}.frow{display:flex;gap:8px;flex-wrap:wrap}.frow input{flex:1;min-width:150px;width:auto}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;margin-top:14px;align-items:start}#fpanel{position:sticky;top:14px}@media(max-width:1100px){.fgrid{grid-template-columns:1fr}#fpanel{position:static}}
.fn{cursor:pointer;outline:none}.fn rect{fill:var(--bg);stroke:var(--bd);stroke-width:1.5}.fn text{fill:var(--tx);font-size:12.5px;pointer-events:none}.fn:hover rect,.fn:focus-visible rect{stroke:var(--mu)}.fn.have rect{stroke:var(--ok)}.fn.gap rect{stroke:var(--warn)}.fn.done rect{fill:#10281a;stroke:var(--ok)}.fn.sel rect{stroke:var(--tx);stroke-width:3}.fn .ck{fill:var(--ok);font-weight:700}
.fe{fill:none;stroke:var(--bd);stroke-width:1.6}.fe.hi{stroke:var(--tx)}.fh{fill:var(--mu);font-size:12px}
.pl{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px;margin:6px 0}.pl:hover{border-color:var(--mu)}.pl img{width:96px;height:54px;object-fit:cover;border-radius:6px;flex:none}.pl span{min-width:0}.pl b{display:block;font-size:.85rem;font-weight:500;line-height:1.3}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;align-items:start}.col{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.ac{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90vw}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;gap:4px;padding:10px}.logo,.sp{display:none}aside button{width:auto;white-space:nowrap;margin:0}main{padding:14px}}

/* Mock-test interface */
.test-shell{max-width:860px}
.test-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.test-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.test-stat{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
.test-stat small{display:block;color:var(--mu);font-size:.76rem}
.test-stat b{font-size:1.15rem}
.timer{font-variant-numeric:tabular-nums}
.timer.warning{color:var(--bad)}
.test-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px}
.question-panel{min-width:0}
.q-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.qnum{padding:8px 4px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);cursor:pointer}
.qnum.current{border-color:var(--tx);background:var(--ac2)}
.qnum.answered{background:#243326;border-color:#4ade80}
.opt.selected{border-color:var(--tx);background:#242426}
.test-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}
.grade-score{font-size:2.5rem;font-weight:750;line-height:1.1}
.skill-grade{display:grid;grid-template-columns:minmax(110px,1fr) 2fr 42px;gap:10px;align-items:center;margin:12px 0}
.skill-grade .bar{margin:0}
@media(max-width:700px){.test-layout{grid-template-columns:1fr}.test-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>
</head>
<body>
<div id="auth" hidden></div>
<div class="app" id="app" hidden>
<aside id="nav"></aside>
<main><div class="top"><h1 id="ttl"></h1><div id="act"></div></div><div id="view"></div></main>
</div>
<div id="bm" hidden><div id="bmsay" hidden></div><div id="bmv"></div></div>
<div id="chat" hidden role="dialog" aria-label="Chat with Baymax"><div class="chh"><b>Baymax</b><button onclick="chatToggle()" aria-label="Close chat">×</button></div><div id="cm" aria-live="polite"></div>
<div id="cq"><button onclick="chip(0)">Build my roadmap</button><button onclick="chip(1)">Plan my weeks</button><button onclick="chip(2)">Explain my gaps</button><button onclick="chip(3)">What should I do today?</button></div>
<div class="cf"><input id="ci" placeholder="Ask Baymax anything" maxlength="1000" autocomplete="off" onkeydown="if(event.key==='Enter')chatSend()"><button class="btn" onclick="chatSend()">Send</button></div></div>
<div id="toast" hidden></div>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST=["Saved","Applied","Interview","Offer","Rejected"],VIEWS=[["ov","Overview"],["flow","Flowchart"],["pro","Profile (LinkedIn & GitHub)"],["test","Skill test"],["road","Roadmap"],["plan","Planner"],["jobs","Vacancies"],["ach","Achievements"]];
let RM=null,PL=null,CH=[],MH=null,CO=false,U=null,A=null,QR=null,QS=null,QI=0,QA=[],QT=null,QTimer=null,T=[],V="ov",MODE="reg",PEND="",FL=null,FS=[],FSEL=null,FRN="",FLOAD=false,PLS={},VJ=null,VQ="",VW="";
async function api(p,m="GET",b){const r=await fetch("/api/"+p,{method:m,headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&!["login","register"].includes(p)){showAuth()}const e=d.detail;throw new Error(typeof e==="string"?e:"Something went wrong")}return d}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4500)}
async function run(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent="Working…";try{await fn()}catch(e){toast(e.message)}finally{btn.disabled=false;btn.textContent=t}}
const nrm=a=>{if(a&&Array.isArray(a.skills))a.skills=a.skills.map(s=>({...s,name:s.name||s.skill||s.title||s.label||"Skill",level:+s.level||0}));return a};
function setState(d){U=d.user;A=nrm(d.analysis);QR=d.quiz_result;RM=d.roadmap;PL=d.planner;FS=d.flows||[]}
async function boot(){if(location.search)history.replaceState({},"","/");try{setState(await api("me"));await enter()}catch{showAuth()}}
let MASC=0;function say(m){const b=$("bmsay");b.textContent=m;b.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>b.hidden=true,6000)}
async function enter(){$("bm").hidden=false;if(!MASC){MASC=1;BMr().then(BM=>BM.mount($("bmv"),{view:{cy:.05,h:2.45,w:1.9},onClick:chatToggle})).then(h=>{MH=h;if(h)say("Hello! Click me to chat.")})}T=await api("apps");$("auth").hidden=true;$("app").hidden=false;draw()}
const BMr=()=>window.BM?Promise.resolve(window.BM):new Promise(r=>addEventListener("bm-ready",()=>r(window.BM),{once:true}));
let HERO=null;
function heroMount(){const ph=$("auth").querySelector(".ahero");if(HERO){ph.replaceWith(HERO);return}HERO=ph;BMr().then(BM=>BM.mount($("hero3d"),{shift:.5,tilt:.3,view:{cy:.52,h:1.55,w:0}})).then(h=>{if(h)ph.classList.add("on3d")})}
function showAuth(){$("bm").hidden=true;$("chat").hidden=true;CO=false;$("app").hidden=true;const a=$("auth");a.hidden=false;const r=MODE==="reg";
a.innerHTML=`<div class="apanel"><div class="abox"><img class="alogo" src="/bayskills-logo.png" alt="BaySkills"><h1 style="font-size:1.7rem">${r?"Create your account":"Welcome back"}</h1><p class="mu">${r?"Get an AI read on your GitHub and LinkedIn against the role you want.":"Log in to see your skill map, gaps and job matches."}</p><div class="tabs"><button class="btn ${r?"":"g"}" onclick="MODE='reg';showAuth()">Register</button><button class="btn ${r?"g":""}" onclick="MODE='login';showAuth()">Log in</button></div>
${r?`<label>Full name</label><input id="rn" autocomplete="name">`:""}<label>Email</label><input id="re" type="email" autocomplete="email"><label>Password (8+ characters)</label><input id="rp" type="password" autocomplete="${r?"new-password":"current-password"}">
${r?`<label>LinkedIn profile link</label><input id="rl" placeholder="https://www.linkedin.com/in/your-name"><small>LinkedIn blocks automated reading, so you will add your profile text after signing in.</small><label>GitHub username or link</label><input id="rg" placeholder="octocat or https://github.com/octocat"><label>Target job role</label><input id="rr" value="Data Analyst">`:""}
<p class="err" id="aerr"></p><button class="btn" style="width:100%" onclick="auth(this)">${r?"Create account":"Log in"}</button></div></div><div class="ahero"><img id="hero" src="/baymax-hello.jpg" alt=""><div id="hero3d" class="h3d"></div><div class="hello"><div class="hi">Hello.</div><p>I am here to help you find the skills between you and your next job.</p></div></div>`;heroMount()}
function auth(b){run(b,async()=>{$("aerr").textContent="";try{const body=MODE==="reg"?{name:rn.value,email:re.value,password:rp.value,linkedin_url:rl.value,github:rg.value,role:rr.value}:{email:re.value,password:rp.value};setState(await api(MODE==="reg"?"register":"login","POST",body));V=MODE==="reg"?"pro":"ov";await enter()}catch(e){$("aerr").textContent=e.message}})}
async function logout(){await api("logout","POST");U=A=QR=RM=PL=FL=VJ=null;FS=[];FSEL=null;FRN="";FLOAD=false;PLS={};VQ=VW="";CH=[];$("cm").innerHTML="";CO=false;MODE="login";showAuth()}
const pct=n=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,n))}%"></i></div>`;
const kpi=(l,v,x="")=>`<div class="card kpi"><small>${l}</small><b>${v}</b>${x}</div>`;
const ul=a=>(a&&a.length)?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="mu">Nothing yet.</p>`;
const IMP={critical:3,important:2,nice:1};
const ytq=s=>`https://www.youtube.com/results?search_query=${encodeURIComponent(s)}&sp=EgIQAw%3D%3D`;
const pill=(t,c="")=>`<span class="chip ${c}">${esc(t)}</span>`;
const learn=n=>`<a class="chip no" target="_blank" rel="noopener" title="Free YouTube playlists" href="${ytq(n+" full course")}">${esc(String(n).replace(/\s*\(.*$/,""))} ▸ learn</a>`;
function gapRows(sk){return sk.map(s=>{const b=s.benchmark==null?null:+s.benchmark,d=b==null?0:b-(+s.level||0);return{...s,b,d,w:d>0?d*(IMP[s.importance]||2):d}}).sort((x,y)=>y.w-x.w||y.d-x.d)}
const bar2=(me,tp)=>`<div class="bar mk"><i style="width:${me/3*100}%"></i>${tp==null?"":`<u style="left:calc(${tp/3*100}% - ${tp>=3?3:1}px)" title="Typical professional"></u>`}</div>`;
function radar(sk){const n=sk.length,c=120,r=80,P=(i,v)=>{const a=i*2*Math.PI/n-Math.PI/2;return[c+Math.cos(a)*r*v,c+Math.sin(a)*r*v]};const ring=v=>sk.map((_,i)=>P(i,v).join(",")).join(" ");const hb=sk.some(s=>s.benchmark!=null);
return`<svg viewBox="-45 -5 330 250" style="width:100%;max-width:380px;display:block;margin:auto">${[1/3,2/3,1].map(v=>`<polygon points="${ring(v)}" style="fill:none;stroke:var(--bd)"/>`).join("")}${sk.map((s,i)=>{const[x,y]=P(i,1.24);return`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" style="fill:var(--mu);font-size:9px">${esc(String(s.name).replace(/\s*\(.*$/,'').slice(0,18))}</text>`}).join("")}${hb?`<polygon points="${sk.map((s,i)=>P(i,(s.benchmark==null?0:+s.benchmark)/3).join(",")).join(" ")}" style="fill:var(--warn);fill-opacity:.08;stroke:var(--warn);stroke-width:1.6;stroke-dasharray:4 3"/>`:""}<polygon points="${sk.map((s,i)=>P(i,(+s.level||0)/3).join(",")).join(" ")}" style="fill:var(--ac);fill-opacity:.25;stroke:var(--ac);stroke-width:2"/></svg>`}
const jobLinks=t=>`<a target="_blank" rel="noopener" href="https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(t)}">LinkedIn</a> · <a target="_blank" rel="noopener" href="https://www.naukri.com/${t.toLowerCase().replace(/[^a-z0-9]+/g,"-")}-jobs">Naukri</a> · <a target="_blank" rel="noopener" href="https://in.indeed.com/jobs?q=${encodeURIComponent(t)}">Indeed</a>`;
const cta=()=>`<div class="card"><h2>Run your first AI analysis</h2><p class="mu">We read your public GitHub, your LinkedIn text and your target role (${esc(U.role)}), compare you with a typical professional in that role, and show where to focus first.</p><button class="btn" onclick="analyze(this)">Analyse my profile</button> <button class="btn g" onclick="V='pro';draw()">Add my LinkedIn text first</button></div>`;
function analyze(b){run(b,async()=>{A=nrm(await api("analyze","POST"));draw();toast("Analysis updated")})}
function pipe(){return`<div class="pipe">${ST.map(s=>`<div><b>${T.filter(x=>x.status===s).length}</b>${s}</div>`).join("")}</div>`}
function focusCard(sk,rows){const hasB=sk.some(s=>s.benchmark!=null);

if(VJ.error)return`<div class="card"><p>${esc(VJ.error)}</p><p>${jobLinks(VJ.q)}</p></div>`;
if(!VJ.jobs.length)return`<div class="card"><p>No openings found for "${esc(VJ.q)}"${VW?" in "+esc(VW):""}. Try a broader title${VJ.local?"":" (this free source lists remote jobs only)"}.</p><p>${jobLinks(VJ.q)}</p></div>`;
return`<p class="mu">${VJ.jobs.length} openings from ${esc(VJ.source)}, best fit first. Fit counts only the skills a posting mentions.</p><div class="grid c2">${VJ.jobs.map((j,i)=>`<div class="card"><div class="h"><h2 style="margin:0">${esc(j.title)}</h2>${j.fit!=null?`<b>${j.fit}%</b>`:`<span class="tag mu">Fit unclear</span>`}</div><small>${esc(j.company)}${j.location?" · "+esc(j.location):""}${j.posted?" · "+esc(j.posted):""}</small>${j.fit!=null?pct(j.fit):""}<p class="mu" style="margin:.5em 0">${esc(j.snippet)}${j.snippet.length>=260?"…":""}</p><div>${j.have.map(s=>pill("✓ "+s,"ok")).join("")}${j.missing.map(learn).join("")}${!j.have.length&&!j.missing.length?`<small class="mu">None of your skills were named in this posting.</small>`:""}</div><p><a class="btn" target="_blank" rel="noopener" href="${esc(j.url)}">Apply</a> </p></div>`).join("")}</div>`}
function jobs(){if(!A)return cta();const roles=[...(A.jobs||[])].sort((a,b)=>b.match-a.match);
return`<div class="card"><h2>Roles you can apply for with your skills</h2><p class="mu" style="margin:0">From your analysis: how well your current skills fit each role, what you already have and what is missing.</p></div>
<div class="grid c2" style="margin-top:14px">${roles.map((j,i)=>`<div class="card"><div class="h"><h2>${esc(j.title)}</h2><b>${+j.match||0}%</b></div>${pct(j.match)}<p class="mu" style="margin:.5em 0">${esc(j.reason)}</p><div>${(j.matched_skills||[]).map(s=>pill("✓ "+s,"ok")).join("")}${(j.missing_skills||[]).map(learn).join("")}</div><p><button class="btn" onclick="showOpen(${i},this)">Show openings</button></p><small>${jobLinks(j.title)}</small></div>`).join("")}</div>
<div class="card" style="margin-top:14px" id="vsrch"><h2>Search live openings</h2><div class="frow"><input id="vq" value="${esc(VQ||A.role)}" maxlength="80" aria-label="Job title" placeholder="Job title"><input id="vw" value="${esc(VW)}" maxlength="60" aria-label="Location" placeholder="City (optional, local source only)"><button class="btn" onclick="findJobs(this)">Search</button></div></div>
<div id="vres" style="margin-top:14px">${vres()}</div>`}
function findJobs(b){VQ=$("vq").value.trim();VW=$("vw").value.trim();return run(b,async()=>{VJ=await api("vacancies?q="+encodeURIComponent(VQ)+"&where="+encodeURIComponent(VW));$("vres").innerHTML=vres()})}
function showOpen(i,b){const r=[...(A.jobs||[])].sort((a,c)=>c.match-a.match)[i];$("vq").value=r.title;findJobs(b).then(()=>$("vres").scrollIntoView({behavior:"smooth"}))}
async function trackJ(i,b){const j=VJ.jobs[i];run(b,async()=>{T=await api("apps","POST",{company:j.company||"Unknown",title:j.title,status:"Saved",url:j.url,location:j.location,fit:j.fit,missing:j.missing});toast("Saved. Find it in Applications.")})}
// ---------- Applications: board + progress ----------
const DAY=86400,now=()=>Date.now()/1000,today=()=>new Date().toLocaleDateString("en-CA");
const ago=ts=>{const d=Math.floor((now()-ts)/DAY);return d<=0?"today":d+"d ago"};
const byId=id=>T.find(x=>x.id===id);
function progHtml(){const n=s=>T.filter(x=>x.status===s).length,applied=T.length-n("Saved"),resp=n("Interview")+n("Offer")+n("Rejected"),wk=T.filter(x=>x.history.some(h=>h.status==="Applied"&&now()-h.ts<7*DAY)).length;
const due=T.filter(x=>!["Offer","Rejected","Saved"].includes(x.status)&&((x.status==="Applied"&&now()-x.updated>=7*DAY)||(x.follow_up&&x.follow_up<=today())));
const need={};T.filter(x=>["Saved","Applied","Interview"].includes(x.status)).forEach(x=>x.missing.forEach(m=>need[m]=(need[m]||0)+1));const nl=Object.entries(need).sort((a,b)=>b[1]-a[1]).slice(0,6);
return`<div class="grid k4">${kpi("Applied",applied,`<small>${wk} in the last 7 days</small>`)}${kpi("Response rate",applied?Math.round(resp/applied*100)+"%":"-",`<small>${resp} of ${applied} replied</small>`)}${kpi("Interviews",n("Interview"))}${kpi("Offers",n("Offer"))}</div>
<div class="grid c2" style="margin-top:14px"><div class="card"><h2>Follow up now</h2>${due.length?due.map(x=>`<p style="margin:.4em 0"><b>${esc(x.title)}</b>, ${esc(x.company)}<br><small class="mu">${x.follow_up&&x.follow_up<=today()?"Follow-up date reached ("+esc(x.follow_up)+")":"No update for "+Math.floor((now()-x.updated)/DAY)+" days. A short follow-up email often helps."}</small></p>`).join(""):`<p class="mu">Nothing is overdue. Applications with no news for 7 days appear here.</p>`}</div>
<div class="card"><h2>Skills to prepare for your open applications</h2>${nl.length?`<div>${nl.map(([m,c])=>`<a class="chip no" target="_blank" rel="noopener" href="${ytq(m+" full course")}">${esc(m)} · ${c} ${c>1?"jobs":"job"} ▸</a>`).join("")}</div><small class="mu">Skills these postings ask for that you do not have yet. Click for free playlists.</small>`:`<p class="mu">Save openings from Vacancies and the skills you still need will show here.</p>`}</div></div>`}
function card(x){return`<div class="ac"><b>${esc(x.title)}</b><br><small>${esc(x.company)}${x.location?" · "+esc(x.location):""}</small>${x.fit!=null?`<div class="h" style="margin-top:6px"><small>Fit ${x.fit}%</small></div>${pct(x.fit)}`:""}<br><small class="mu">Updated ${ago(x.updated)}${x.follow_up?" · follow up "+esc(x.follow_up):""}</small>${x.missing.length?`<div style="margin-top:4px">${x.missing.slice(0,3).map(learn).join("")}</div>`:""}
<select style="margin-top:8px" aria-label="Status" onchange="setT(${x.id},this.value)">${ST.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select>
<details><summary class="mu" style="cursor:pointer;margin-top:6px">Notes and follow-up</summary><textarea id="nt${x.id}" rows="3" placeholder="Contacts, interview dates, what to revise">${esc(x.notes)}</textarea><label>Follow up on</label><input type="date" id="fu${x.id}" value="${esc(x.follow_up)}"><p>${x.history.map(h=>`<small class="mu">${esc(h.status)} ${ago(h.ts)}</small>`).join(" → ")}</p><p><button class="btn g" onclick="saveN(${x.id},this)">Save</button> ${x.url?`<a class="btn g" target="_blank" rel="noopener" href="${esc(x.url)}">Open posting</a> `:""}<button class="btn g" onclick="delT(${x.id})">Delete</button></p></details></div>`}
function trk(){return`${progHtml()}<div class="card" style="margin-top:14px"><h2>Add an application</h2><div class="frow"><input id="tc" placeholder="Company" maxlength="100" aria-label="Company"><input id="tt" placeholder="Role" value="${esc(PEND||U.role)}" maxlength="100" aria-label="Role"><select id="ts" aria-label="Status" style="max-width:150px">${ST.map(s=>`<option ${s==="Applied"?"selected":""}>${s}</option>`).join("")}</select><button class="btn" onclick="addT(this)">Add</button></div></div>
<div class="board" style="margin-top:14px">${ST.map(s=>{const l=T.filter(x=>x.status===s);return`<div class="col"><h2>${s} <span class="tag mu">${l.length}</span></h2>${l.map(card).join("")||`<small class="mu">Empty</small>`}</div>`}).join("")}</div>`}
function addT(b){if(!$("tc").value.trim())return toast("Enter the company name");run(b,async()=>{PEND="";T=await api("apps","POST",{company:$("tc").value,title:$("tt").value,status:$("ts").value});draw()})}
async function setT(id,s){try{T=await api("apps/"+id,"PUT",{status:s});draw()}catch(e){toast(e.message)}}
function saveN(id,b){run(b,async()=>{T=await api("apps/"+id,"PUT",{notes:$("nt"+id).value,follow_up:$("fu"+id).value});toast("Saved")})}
async function delT(id){if(!confirm("Delete this application?"))return;try{T=await api("apps/"+id,"DELETE");draw()}catch(e){toast(e.message)}}

// ---------- Baymax chat ----------
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^\s*[-*] /gm,"• ").replace(/\n/g,"<br>");
function chatMsg(r,t){const m=document.createElement("div");m.className="m "+r;m.innerHTML=r==="u"?esc(t):fmt(t);$("cm").appendChild(m);$("cm").scrollTop=1e9;return m}
function chatToggle(){CO=!CO;$("chat").hidden=!CO;$("bmsay").hidden=true;if(CO){if(!$("cm").children.length)chatMsg("b","Hello! I am Baymax. I can explain your gaps, build a roadmap, plan your weeks, or help you decide what to do next.");if(MH)MH.nod();$("ci").focus()}}
addEventListener("keydown",e=>{if(e.key==="Escape"&&CO)chatToggle()});
async function chatSend(){const i=$("ci"),t=i.value.trim();if(!t)return;i.value="";chatMsg("u",t);CH.push({role:"user",content:t});const w=chatMsg("b","Thinking…");w.classList.add("mu");if(MH)MH.nod();
try{const d=await api("chat","POST",{messages:CH.slice(-12)});CH.push({role:"assistant",content:d.reply});w.classList.remove("mu");w.innerHTML=fmt(d.reply);if(MH)MH.nod()}catch(e){CH.pop();w.classList.remove("mu");w.textContent=e.message}$("cm").scrollTop=1e9}
async function chip(i){if(i>1){$("ci").value=["Explain my biggest skill gaps and what to do first.","Based on my profile, what should I work on today?"][i-2];return chatSend()}
const rd=i===0;chatMsg("u",rd?"Build my roadmap":"Plan my weeks");const w=chatMsg("b","Working on it…");w.classList.add("mu");
try{if(rd)RM=await api("roadmap/generate","POST");else PL=await api("planner/generate","POST",{hours:8,weeks:6});w.classList.remove("mu");w.textContent=rd?"Your roadmap is ready. I opened it for you.":"Your 6-week planner is ready at 8 hours a week. You can change that on the Planner page.";V=rd?"road":"plan";draw();if(MH)MH.nod()}catch(e){w.classList.remove("mu");w.textContent=e.message}}
// ---------- Roadmap ----------
function road(){if(!RM)return`<div class="card" style="max-width:700px"><h2>Build your roadmap</h2><p class="mu">A step-by-step path from where you are now to ${esc(U.role)}, based on your analysis.${A?"":" Run the AI analysis first for a sharper plan."}</p><button class="btn" onclick="genRoad(this)">Build my roadmap</button></div>`;
return`<div class="card"><h2>${esc(RM.title)}</h2><p style="margin:0 0 6px">${esc(RM.summary)}</p><small>${RM.total_weeks?"About "+RM.total_weeks+" weeks":""}</small></div>
<div class="rm">${RM.phases.map((p,i)=>`<div class="ph"><div class="dot">${i+1}</div><div class="card"><div class="h"><h2>${esc(p.name)}</h2><span class="tag mu">${esc(p.weeks)}</span></div><p style="margin:.2em 0 .6em">${esc(p.goal)}</p><b>Learn</b>${ul(p.skills)}<b>Do</b>${ul(p.tasks)}<p style="margin:.6em 0"><b>Project:</b> ${esc(p.project)}</p><b>Resources</b>${ul(p.resources)}</div></div>`).join("")}</div>
<div class="card" style="margin-top:14px"><h2>Milestones</h2>${ul(RM.milestones)}</div><p><button class="btn g" onclick="genRoad(this)">Rebuild roadmap</button> <button class="btn g" onclick="V='plan';draw()">Plan my weeks</button></p>`}
function genRoad(b){run(b,async()=>{RM=await api("roadmap/generate","POST");draw();if(MH)MH.nod()})}
// ---------- Planner ----------
function plan(){if(!PL)return`<div class="card" style="max-width:560px"><h2>Plan your weeks</h2><p class="mu">Tell me how much time you have. I turn your roadmap into a day-by-day plan you can tick off.</p><label for="plh">Hours per week</label><select id="plh">${[3,5,8,10,15,20].map(n=>`<option ${n===8?"selected":""}>${n}</option>`).join("")}</select><label for="plw">Number of weeks</label><select id="plw">${[2,4,6,8,10,12].map(n=>`<option ${n===6?"selected":""}>${n}</option>`).join("")}</select><p><button class="btn" onclick="genPlan(this)">Build my planner</button></p></div>`;
const all=PL.plan.flatMap(w=>w.days.map(d=>d.id)),dn=PL.done.filter(i=>all.includes(i)).length;
return`<div class="card"><div class="h"><h2>${PL.hours} hours a week for ${PL.plan.length} weeks</h2><b>${dn}/${all.length} done</b></div>${pct(all.length?dn/all.length*100:0)}</div>
<div class="grid c2" style="margin-top:14px">${PL.plan.map(w=>`<div class="card"><h2>Week ${w.week}: ${esc(w.focus)}</h2>${w.days.map(d=>`<label class="tk"><input type="checkbox" ${PL.done.includes(d.id)?"checked":""} onchange="tick('${d.id}',this.checked)"><span><b>${esc(d.day)}</b>, ${d.hours}h<br>${esc(d.task)}</span></label>`).join("")}</div>`).join("")}</div>
<p><button class="btn g" onclick="PL=null;draw()">Make a new plan</button></p>`}
function genPlan(b){run(b,async()=>{PL=await api("planner/generate","POST",{hours:+$("plh").value,weeks:+$("plw").value});draw();if(MH)MH.nod()})}
async function tick(id,on){const s=new Set(PL.done);on?s.add(id):s.delete(id);PL.done=[...s];draw();try{await api("planner/progress","POST",{done:PL.done})}catch(e){toast(e.message)}}
// ---------- Achievements ----------
function badges(){const sk=(A&&A.skills)||[],dn=PL?PL.done:[],w1=PL&&PL.plan[0]?PL.plan[0].days.map(d=>d.id):[],st=s=>T.some(x=>x.status===s),lv=QR?QR.level:"";
return[["Hello, world","Create your BaySkills account",10,1],["First scan","Run your first AI analysis",20,!!A],["Test taker","Finish the skill test",20,!!QR],["Getting good","Reach Intermediate in the skill test",30,["Intermediate","Advanced"].includes(lv)],["Top of the class","Reach Advanced in the skill test",50,lv==="Advanced"],["Skill builder","Have 3 skills at working level or better",30,sk.filter(s=>s.level>=2).length>=3],["Path finder","Build a skill flowchart for a role",20,FS.length>0],["Learner","Mark 5 flowchart skills as learned",30,FS.reduce((a,x)=>a+x.done,0)>=5],["On the map","Build your roadmap",20,!!RM],["Time keeper","Build your weekly planner",20,!!PL],["On a roll","Tick off 5 planner tasks",30,dn.length>=5],["Week one done","Finish every task in week 1",40,w1.length>0&&w1.every(i=>dn.includes(i))],["Job ready","Reach a readiness score of 70",50,!!A&&+A.profile_score>=70]].map(([n,d,x,g])=>({n,d,x,g}))}
function ach(){const b=badges(),xp=b.filter(x=>x.g).reduce((a,x)=>a+x.x,0),lv=Math.floor(xp/100)+1;
return`<div class="card"><div class="h"><h2>Level ${lv}</h2><b>${xp} XP</b></div>${pct(xp%100)}<small>${100-xp%100} XP to level ${lv+1}. ${b.filter(x=>x.g).length} of ${b.length} badges earned.</small></div>
<div class="grid c2" style="margin-top:14px">${b.map(x=>`<div class="card" style="${x.g?"":"opacity:.45"}"><div class="h"><h2>${esc(x.n)}</h2><span class="tag">${x.g?"Earned":"Locked"}</span></div><p class="mu" style="margin:0">${esc(x.d)}. ${x.x} XP</p></div>`).join("")}</div>`}
function draw(){$("nav").innerHTML=`<div class="logo"><img src="/bayskills-logo.png" alt="BaySkills" style="width:100%;max-width:120px;display:block"></div>`+VIEWS.map(([k,n])=>`<button class="${k===V?"on":""}" onclick="V='${k}';draw()">${n}</button>`).join("")+`<div class="sp"></div><small style="padding:0 12px">${esc(U.name)}</small><button onclick="logout()">Log out</button>`;
$("ttl").textContent=VIEWS.find(v=>v[0]===V)[1];$("act").innerHTML=V==="ov"&&A?`<button class="btn" onclick="analyze(this)">Re-run AI analysis</button>`:"";
$("view").innerHTML={ov,flow,pro,test,road,plan,ach,jobs,trk}[V]()}
boot();
</script>
</body>
</html>
